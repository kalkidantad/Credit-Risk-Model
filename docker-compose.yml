services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-file:///app/mlruns}
      MLFLOW_MODEL_URI: ${MLFLOW_MODEL_URI:-models:/credit_risk_classifier/Production}
      FEATURE_COLUMNS_PATH: ${FEATURE_COLUMNS_PATH:-/app/data/processed/feature_columns.json}
    volumes:
      - ./mlruns:/app/mlruns:ro
      - ./data/processed:/app/data/processed:ro
